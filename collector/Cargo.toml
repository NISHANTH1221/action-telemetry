[package]
name = "ci-telemetry-collector"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "telemetry"
path = "src/lib.rs"

[[bin]]
name = "collector"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
